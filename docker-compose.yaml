version: '3.9'
services:
  LeBonPetiPlatPostgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '5433:5432'
    networks:
      - LeBonPetitPlat
  LeBonPetitPlatMongoDB:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - '27017:27017'
    networks:
      - LeBonPetitPlat
networks:
  LeBonPetitPlat:
    external: true
